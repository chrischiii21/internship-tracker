name: Security Audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secrets:
    name: TruffleHog secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, needed for the scan

      - uses: trufflesecurity/trufflehog@v3.99.8
        with:
          extra_args: --results=verified,unknown
